<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Browser Annotations demo</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font: 16px/1.4 ui-sans-serif, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main { max-width: 720px; margin: 40px auto; padding: 0 20px 80px; }
      h1 { font-size: 28px; margin-bottom: 8px; }
      .lede { color: #475569; margin-bottom: 24px; }
      .card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      label { display: block; font-size: 13px; color: #64748b; margin-bottom: 4px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font: inherit;
        margin-bottom: 12px;
      }
      #active-workout-actions {
        display: flex;
        gap: 12px;
      }
      #complete {
        flex: 1;
        background: #f97316;
        color: white;
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        font: inherit;
        font-weight: 650;
      }
      #cancel {
        flex: 1;
        background: #fecdd3;
        color: #9f1239;
        border: 0;
        border-radius: 12px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Session details</h1>
      <p class="lede">Load the unpacked extension, then click it and comment on the buttons below.</p>
      <section>
        <div class="card">
          <form>
            <label for="name">Workout name</label>
            <input id="name" value="Easy run" />
            <div id="active-workout-actions">
              <button id="complete" type="button">✓ Complete workout</button>
              <button id="cancel" type="button">✕ Cancel workout</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
